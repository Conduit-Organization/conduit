  </g>

  <text x="172" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#e7f0ef">Conduit</text>
  <text x="174" y="108" font-family="ui-monospace, 'SF Mono', monospace" font-size="15" letter-spacing="1.5" fill="#8a9aa6">serverless P2P inference market</text>
  <text x="174" y="130" font-family="ui-monospace, 'SF Mono', monospace" font-size="13" letter-spacing="0.5" fill="#2be3a8">a settled USD₮ payment is the access handshake</text>
